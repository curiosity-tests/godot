name: 📊 Static Checks

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_call gained chalk_on/profile inputs, threaded down from
#      runner.yml. A reusable workflow does not inherit the caller's `env`.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms.
#   3. permissions: id-token: write for the action's OIDC connect.
#   4. A fail-closed assertion on the instrumented arm.
# The check COMMANDS are untouched.

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "'true' to build under chalk/curiosity observables."
        required: false
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        required: false
        type: string
        default: curiosity-tests-racecar
    outputs:
      changed-files:
        description: A list of changed files, pre-filtered for parsing by clangd-tidy.
        value: ${{ jobs.static-checks.outputs.changed-files }}
      sources-changed:
        description: Determines if any source files were changed.
        value: ${{ jobs.static-checks.outputs.sources-changed }}
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CHALK_ON: ${{ inputs.chalk_on || 'false' }}

jobs:
  static-checks:
    name: Code style, file formatting, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed-files: '"${{ steps.changed-files.outputs.clangd_all_changed_files }}"' # Wrap with quotes to bookend internal quote separators.
      sources-changed: ${{ steps.changed-files.outputs.sources_any_changed }}
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # Default is best-effort; a silently-uninstrumented run is a corrupt
          # data point rather than a degraded one, so fail closed.
          observables_continue_on_error: false
          # Upstream used actions/checkout, which does not fetch LFS. Keep the
          # tree identical to what upstream CI builds.
          lfs: false
          fetch-depth: 0 # Treeless clone. Slightly less performant than a shallow clone, but makes finding diffs instantaneous.
          # NOTE: upstream also passed `filter: tree:0`. action-checkout wraps
          # actions/checkout@v4.1.7, which has no `filter` input, so the clone is
          # a full one instead of treeless. Both arms lose it identically, so the
          # baseline/instrumented comparison is unaffected.

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected, so an empty LD_PRELOAD is what
      # SUCCESS looks like from inside the shell. co-hostd daemonizes, so pgrep
      # is no good either. Socket existence is what curiosity's own CI gates on.
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      # This needs to happen before Python and npm execution; it must happen before any extra files are written.
      - name: .gitignore checks (gitignore_check.sh)
        run: |
          bash ./misc/scripts/gitignore_check.sh

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          safe_output: false # Output passed to environment variable to avoid command injection.
          separator: '" "' # To account for paths with spaces, ensure our items are split by quotes internally.
          skip_initial_fetch: true
          files_yaml_from_source_file: .github/changed_files.yml

      - name: Style checks via prek
        uses: j178/prek-action@v3.0.0
        env:
          FROM_REF: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.event.before != '0000000000000000000000000000000000000000' && github.event.before
            || 'HEAD~1' }}
        with:
          extra-args: --from-ref ${{ env.FROM_REF }}
